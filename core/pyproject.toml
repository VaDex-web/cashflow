[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cashflow-core"
version = "0.1.0"
description = "Ядро прогноза остатка и кассовых разрывов для малого бизнеса"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cashflow-demo = "cashflow_core.demo:main"
cashflow-report = "cashflow_core.report:main"

[tool.setuptools.packages.find]
include = ["cashflow_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
